<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Femke's Keuken">
<meta name="theme-color" content="#f6efe6">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Femke's Keuken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe6; --card:#fffaf4; --ink:#2b211b; --muted:#8a7a6d; --line:#eadfd2;
  --accent:#c4552d; --accent-soft:#f7ddd0; --green:#5f7d4e; --green-soft:#e3ebd9;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px}
header.top{padding:18px 18px 6px;max-width:560px;margin:0 auto}
header.top .hi{color:var(--muted);font-size:14px}
header.top h1{font-size:32px;line-height:1.1;margin-top:2px}

/* random picker */
.pick{margin:16px 0 4px;background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pick small{opacity:.7;display:block;font-size:13px}
.pick strong{font-family:Fraunces,serif;font-size:19px;display:block;margin-top:2px;min-height:24px}
.pick button{background:#fff;color:var(--ink);border-radius:999px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}

/* recipe cards */
.list{display:grid;gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.emoji{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
.card h3{font-size:19px}
.card p{margin:3px 0 0;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;margin-top:7px}
.chev{margin-left:auto;color:var(--muted);font-size:20px}
.add-card{border:1.5px dashed var(--line);background:transparent;justify-content:center;color:var(--muted);font-weight:500;padding:18px}

/* detail */
.detail{display:none}
.back{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;padding:6px 0 14px}
.hero{border-radius:22px;padding:22px 20px;margin-bottom:16px}
.hero .emoji{width:auto;height:auto;font-size:44px;display:block;margin-bottom:8px;text-align:left}
.hero h2{font-size:28px;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--ink);opacity:.75;font-size:15px}
.actions{display:flex;gap:10px;margin-bottom:18px}
.btn{flex:1;border-radius:14px;padding:13px 10px;font-weight:600;font-size:15px;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary.on{background:var(--green)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 16px 10px;margin-bottom:14px}
.section h3{font-size:18px;padding:12px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.section h3 small{font-family:Inter;font-weight:500;font-size:13px;color:var(--muted)}
.ing{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ing:first-of-type{border-top:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #d6c7b8;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.ing.done .box{background:var(--green);border-color:var(--green)}
.ing.done span.t{text-decoration:line-through;color:var(--muted)}
.step{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;line-height:1.45}
.step:first-of-type{border-top:0}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none;margin-top:1px}
.step.done{opacity:.4}
.step.done .num{background:var(--green-soft);color:var(--green)}
.note{font-size:13px;color:var(--muted);padding:4px 0 6px}
.del{color:#a33;font-size:14px;font-weight:500;padding:10px 0;display:block;margin:0 auto}

/* shopping */
.shop{display:none}
.shop h2{font-size:28px;margin:6px 0 4px}
.shop .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.group-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:14px 0 4px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;line-height:1.5}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.extra{display:flex;gap:8px;margin-top:6px}
.extra input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-size:16px}
.extra button{background:var(--ink);color:#fff;border-radius:12px;padding:0 16px;font-weight:600}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,250,244,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
nav.tabs button .ic{font-size:22px}
nav.tabs button.active{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(43,33,27,.4);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;z-index:21}
.sheet.open{transform:none}
.sheet h2{font-size:24px;margin-bottom:12px}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.sheet input,.sheet textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-size:16px}
.sheet textarea{min-height:120px;resize:vertical}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap}
.emoji-row button{font-size:24px;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.emoji-row button.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header class="top" id="topHeader">
  <div class="hi" id="greet">Hoi Femke</div>
  <h1>Wat eten we vandaag?</h1>
</header>

<!-- HOME -->
<main class="wrap" id="home">
  <div class="pick">
    <div><small>Geen idee?</small><strong id="pickName">Laat het lot beslissen</strong></div>
    <button id="pickBtn">🎲 Kies</button>
  </div>
  <div class="list" id="list"></div>
</main>

<!-- DETAIL -->
<main class="wrap detail" id="detail"></main>

<!-- SHOPPING -->
<main class="wrap shop" id="shop"></main>

<nav class="tabs">
  <button id="tabRecipes" class="active"><span class="ic">🍳</span>Recepten</button>
  <button id="tabShop"><span class="ic">🛒</span>Boodschappen<span class="badge" id="badge" hidden>0</span></button>
</nav>

<!-- ADD SHEET -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h2>Nieuw recept</h2>
  <label>Naam</label>
  <input id="fName" placeholder="Bijv. Pasta pesto">
  <label>Icoon</label>
  <div class="emoji-row" id="emojiRow"></div>
  <label>Ingrediënten (één per regel)</label>
  <textarea id="fIng" placeholder="200 g pasta&#10;1 pot pesto&#10;cherrytomaatjes"></textarea>
  <label>Bereiding (één stap per regel, mag leeg)</label>
  <textarea id="fSteps" placeholder="Kook de pasta&#10;Meng met pesto"></textarea>
  <div class="actions" style="margin-top:16px">
    <button class="btn ghost" id="cancelAdd">Annuleren</button>
    <button class="btn primary" id="saveAdd">Opslaan</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="recepten.js"></script>
<script>
const BASE = window.RECEPTEN || [];
const COLORS = ["#dfe9d6","#dde6f0","#f3dfe9","#f7ddd0","#f9e6c9"];
const EMOJIS = ["🍝","🥗","🌮","🍛","🥘","🍕","🍜","🥩","🐟","🥦"];

/* --- opslag (alleen op dit toestel) --- */
const store = {
  get(k,d){try{const v=localStorage.getItem("fk_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("fk_"+k,JSON.stringify(v))}catch(e){}}
};
let custom = store.get("custom",[]);
let cart = store.get("cart",[]);            // recipe ids op de lijst
let checked = store.get("checked",{});      // "id|i" -> true (boodschappen afgevinkt)
let cookChecks = store.get("cook",{});      // "id|ing|i" / "id|step|i"
let extras = store.get("extras",[]);        // [{t, done}]
const save = ()=>{store.set("custom",custom);store.set("cart",cart);store.set("checked",checked);store.set("cook",cookChecks);store.set("extras",extras);updateBadge();};

const all = ()=>BASE.concat(custom);
const byId = id=>all().find(r=>r.id===id);
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1600)}

/* begroeting */
(function(){const h=new Date().getHours();$("#greet").textContent=(h<12?"Goedemorgen":h<18?"Hoi":"Goedenavond")+" Femke 👋"})();

/* --- HOME --- */
function renderList(){
  $("#list").innerHTML = all().map(r=>`
    <button class="card" data-open="${r.id}">
      <div class="emoji" style="background:${r.color}">${r.emoji}</div>
      <div>
        <h3>${esc(r.name)}</h3>
        <p>${esc(r.desc||r.ing.length+" ingrediënten")}</p>
        ${cart.includes(r.id)?'<span class="tag" style="background:var(--green-soft);color:var(--green)">✓ Op boodschappenlijst</span>':(r.tag?`<span class="tag" style="background:${r.color}">${esc(r.tag)}</span>`:"")}
      </div>
      <span class="chev">›</span>
    </button>`).join("") +
    `<button class="card add-card" id="addBtn">＋ Eigen recept toevoegen</button>`;
}
$("#list").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o) return openRecipe(o.dataset.open);
  if(e.target.closest("#addBtn")) openSheet();
});
$("#pickBtn").addEventListener("click",()=>{
  const list=all(); let n=0; const el=$("#pickName");
  const iv=setInterval(()=>{el.textContent=list[Math.floor(Math.random()*list.length)].name;if(++n>10){clearInterval(iv);
    const r=list[Math.floor(Math.random()*list.length)];el.innerHTML=`<span data-pick="${r.id}" style="text-decoration:underline">${r.emoji} ${esc(r.name)}</span>`;}},70);
});
$("#pickName").addEventListener("click",e=>{const p=e.target.closest("[data-pick]");if(p)openRecipe(p.dataset.pick)});

/* --- DETAIL --- */
let current=null;
function openRecipe(id){
  current=id; const r=byId(id); if(!r) return;
  const inCart=cart.includes(id);
  const doneIng=r.ing.filter((_,i)=>cookChecks[id+"|ing|"+i]).length;
  $("#detail").innerHTML = `
    <button class="back" data-act="back">‹ Recepten</button>
    <div class="hero" style="background:${r.color}">
      <span class="emoji">${r.emoji}</span>
      <h2>${esc(r.name)}</h2>
      ${r.desc?`<p>${esc(r.desc)}</p>`:""}
    </div>
    <div class="actions">
      <button class="btn primary ${inCart?"on":""}" data-act="cart">${inCart?"✓ Op de lijst":"🛒 Op boodschappenlijst"}</button>
      <button class="btn ghost" data-act="reset" style="flex:.5">↺ Reset</button>
    </div>
    <div class="section">
      <h3>Ingrediënten <small>${doneIng}/${r.ing.length} klaar</small></h3>
      ${r.ing.map((t,i)=>`<button class="ing ${cookChecks[id+"|ing|"+i]?"done":""}" data-ing="${i}"><span class="box">✓</span><span class="t">${esc(t)}</span></button>`).join("")}
    </div>
    ${r.steps&&r.steps.length?`
    <div class="section">
      <h3>Bereiding</h3>
      ${r.base!==false&&BASE.includes(r)?'<div class="note">Tik op een stap om hem af te vinken.</div>':""}
      ${r.steps.map((t,i)=>`<button class="step ${cookChecks[id+"|step|"+i]?"done":""}" data-step="${i}"><span class="num">${i+1}</span><span>${esc(t)}</span></button>`).join("")}
    </div>`:""}
    ${BASE.includes(r)?"":`<button class="del" data-act="delete">Recept verwijderen</button>`}
  `;
  show("detail"); window.scrollTo(0,0);
}
$("#detail").addEventListener("click",e=>{
  const id=current, r=byId(id);
  const a=e.target.closest("[data-act]");
  if(a){
    const act=a.dataset.act;
    if(act==="back") return show("home");
    if(act==="cart"){ if(cart.includes(id)){cart=cart.filter(x=>x!==id);toast("Van de lijst gehaald")} else {cart.push(id);toast("Op de boodschappenlijst 🛒")} save(); return openRecipe(id); }
    if(act==="reset"){ Object.keys(cookChecks).forEach(k=>{if(k.startsWith(id+"|"))delete cookChecks[k]}); save(); return openRecipe(id); }
    if(act==="delete"){ if(a.dataset.sure){ custom=custom.filter(x=>x.id!==id); cart=cart.filter(x=>x!==id); save(); toast("Verwijderd"); return show("home"); } a.dataset.sure="1"; a.textContent="Tik nog een keer om te verwijderen"; return; }
  }
  const ing=e.target.closest("[data-ing]");
  if(ing){const k=id+"|ing|"+ing.dataset.ing; cookChecks[k]=!cookChecks[k]; if(!cookChecks[k])delete cookChecks[k]; save();
    ing.classList.toggle("done"); const n=r.ing.filter((_,i)=>cookChecks[id+"|ing|"+i]).length; ing.parentElement.querySelector("small").textContent=n+"/"+r.ing.length+" klaar"; return;}
  const st=e.target.closest("[data-step]");
  if(st){const k=id+"|step|"+st.dataset.step; cookChecks[k]=!cookChecks[k]; if(!cookChecks[k])delete cookChecks[k]; save(); st.classList.toggle("done");}
});

/* --- BOODSCHAPPEN --- */
function renderShop(){
  const recs=cart.map(byId).filter(Boolean);
  let total=0, done=0;
  recs.forEach(r=>r.ing.forEach((_,i)=>{total++; if(checked[r.id+"|"+i])done++;}));
  extras.forEach(x=>{total++; if(x.done)done++;});
  let html=`<h2>Boodschappen</h2><div class="sub">${total?`${done} van ${total} in je mandje`:"Nog niets op de lijst"}</div>`;
  if(!recs.length && !extras.length){
    html+=`<div class="empty"><b>🛒</b>Open een recept en tik op<br><strong>“Op boodschappenlijst”</strong>.</div>`;
  }
  recs.forEach(r=>{
    html+=`<div class="section"><h3>${r.emoji} ${esc(r.name)} <small><button data-rm="${r.id}" style="color:var(--accent);font-size:13px;font-weight:600">Weghalen</button></small></h3>
      ${r.ing.map((t,i)=>`<button class="ing ${checked[r.id+"|"+i]?"done":""}" data-chk="${r.id}|${i}"><span class="box">✓</span><span class="t">${esc(t)}</span></button>`).join("")}</div>`;
  });
  html+=`<div class="section"><h3>Overig</h3>
    ${extras.map((x,i)=>`<button class="ing ${x.done?"done":""}" data-ex="${i}"><span class="box">✓</span><span class="t">${esc(x.t)}</span></button>`).join("")}
    <form class="extra" id="exForm"><input id="exIn" placeholder="Bijv. melk, wc-papier…" autocomplete="off"><button>＋</button></form>
    <div style="height:8px"></div></div>`;
  if(total){
    html+=`<div class="actions"><button class="btn ghost" data-act="copy">📋 Kopieer lijst</button><button class="btn ghost" data-act="clear">🗑 Lijst leegmaken</button></div>`;
  }
  $("#shop").innerHTML=html;
}
$("#shop").addEventListener("submit",e=>{e.preventDefault();const v=$("#exIn").value.trim();if(!v)return;extras.push({t:v,done:false});save();renderShop();$("#exIn").focus()});
$("#shop").addEventListener("click",async e=>{
  const c=e.target.closest("[data-chk]"); if(c){const k=c.dataset.chk;checked[k]=!checked[k];if(!checked[k])delete checked[k];save();return renderShop();}
  const x=e.target.closest("[data-ex]"); if(x){const i=+x.dataset.ex; if(extras[i].done&&x._hold){} extras[i].done=!extras[i].done; save(); return renderShop();}
  const rm=e.target.closest("[data-rm]"); if(rm){const id=rm.dataset.rm;cart=cart.filter(z=>z!==id);Object.keys(checked).forEach(k=>{if(k.startsWith(id+"|"))delete checked[k]});save();return renderShop();}
  const a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="clear"){ if(!a.dataset.sure){a.dataset.sure="1";a.textContent="Zeker weten?";return;} cart=[];checked={};extras=[];save();renderShop();toast("Lijst is leeg");}
  if(a.dataset.act==="copy"){
    const lines=[];
    cart.map(byId).filter(Boolean).forEach(r=>{lines.push(r.name.toUpperCase());r.ing.forEach((t,i)=>{if(!checked[r.id+"|"+i])lines.push("- "+t)});lines.push("")});
    const ex=extras.filter(x=>!x.done); if(ex.length){lines.push("OVERIG");ex.forEach(x=>lines.push("- "+x.t));}
    try{await navigator.clipboard.writeText(lines.join("\n").trim());toast("Gekopieerd ✓");}catch(err){toast("Kopiëren lukte niet");}
  }
});
function updateBadge(){const b=$("#badge");const n=cart.length+extras.filter(x=>!x.done).length;b.hidden=!n;b.textContent=n;}

/* --- NAVIGATIE --- */
function show(view){
  $("#home").style.display=view==="home"?"block":"none";
  $("#detail").style.display=view==="detail"?"block":"none";
  $("#shop").style.display=view==="shop"?"block":"none";
  $("#topHeader").style.display=view==="home"?"block":"none";
  $("#tabRecipes").classList.toggle("active",view!=="shop");
  $("#tabShop").classList.toggle("active",view==="shop");
  if(view==="home")renderList();
  if(view==="shop")renderShop();
  window.scrollTo(0,0);
}
$("#tabRecipes").onclick=()=>show("home");
$("#tabShop").onclick=()=>show("shop");

/* --- NIEUW RECEPT --- */
let selEmoji=EMOJIS[0];
function openSheet(){
  $("#fName").value="";$("#fIng").value="";$("#fSteps").value="";selEmoji=EMOJIS[0];
  $("#emojiRow").innerHTML=EMOJIS.map(e=>`<button type="button" data-em="${e}" class="${e===selEmoji?"sel":""}">${e}</button>`).join("");
  $("#sheetBg").style.display="block"; requestAnimationFrame(()=>$("#sheet").classList.add("open"));
}
function closeSheet(){$("#sheet").classList.remove("open");setTimeout(()=>$("#sheetBg").style.display="none",250);}
$("#emojiRow").addEventListener("click",e=>{const b=e.target.closest("[data-em]");if(!b)return;selEmoji=b.dataset.em;[...$("#emojiRow").children].forEach(x=>x.classList.toggle("sel",x===b));});
$("#sheetBg").onclick=closeSheet; $("#cancelAdd").onclick=closeSheet;
$("#saveAdd").onclick=()=>{
  const name=$("#fName").value.trim(); const ing=$("#fIng").value.split("\n").map(s=>s.replace(/^[-•⁠\s]+/,"").trim()).filter(Boolean);
  if(!name||!ing.length){toast("Vul een naam en ingrediënten in");return;}
  const steps=$("#fSteps").value.split("\n").map(s=>s.trim()).filter(Boolean);
  custom.push({id:"c"+Date.now(),name,emoji:selEmoji,color:COLORS[custom.length%COLORS.length],desc:"",tag:"",ing,steps});
  save(); closeSheet(); renderList(); toast("Recept opgeslagen ✓");
};

updateBadge(); show("home");
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
