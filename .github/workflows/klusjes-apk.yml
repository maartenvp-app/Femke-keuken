name: Klusjes APK bouwen

on:
  push:
    branches: [main]
    paths: ["klusjes-android/**", ".github/workflows/klusjes-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klusjes-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bouwen
        run: gradle assembleRelease --no-daemon
      - name: Publiceren als release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk klusjes.apk
          TAG="klusjes-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" klusjes.apk --repo "$GITHUB_REPOSITORY" \
            --title "Klusjes Android ${GITHUB_RUN_NUMBER}" \
            --notes "Installeer klusjes.apk op je Android-telefoon." --latest
