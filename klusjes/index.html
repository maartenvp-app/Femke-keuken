<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klusjes">
<meta name="theme-color" content="#f3f1ea">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Klusjes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea; --card:#fffdf8; --ink:#22251f; --muted:#7c7f74; --line:#e4e0d4;
  --accent:#3d7a57; --accent-soft:#dcebe1; --late:#c4452d; --late-soft:#f8ddd5; --today:#c98a1b; --today-soft:#f7ebcf;
  --m:#3f6fb5; --m-soft:#dce7f6; --f:#d0587e; --f-soft:#f8dde6;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;max-width:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 20px}
header.top{max-width:560px;margin:0 auto;padding:16px 16px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header.top .hi{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:7px}
header.top h1{font-size:30px;line-height:1.1;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:#b9b6aa;display:inline-block}
.dot.live{background:#3fae6a;box-shadow:0 0 0 3px #3fae6a33}
.dot.off{background:var(--today)}
.gear{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none}

/* score strip */
.strip{margin:14px 0 4px;background:var(--ink);color:#fff;border-radius:var(--radius);padding:14px 16px}
.strip .row{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:14px}
.strip .row b{font-family:Fraunces,serif;font-size:24px;font-weight:700}
.strip small{opacity:.65;font-size:12.5px}
.barwrap{position:relative;margin:9px 0 6px}
.bar{height:10px;border-radius:99px;background:#ffffff22;overflow:hidden;display:flex}
.doel{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1.5px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px #22251f}
.bar i{display:block;height:100%;transition:width .4s}

/* chips */
.filters{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* chore cards */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:14px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px 12px 12px;display:flex;gap:8px;align-items:center}
.card .main{flex:1;min-width:0;display:flex;gap:11px;align-items:center;text-align:left}
.emoji{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:25px;flex:none;background:var(--accent-soft)}
.card h3{font-family:Inter,sans-serif;font-size:16px;font-weight:600;overflow-wrap:break-word;line-height:1.25}
.card .txt{flex:1;min-width:0}
.card p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:5px;background:var(--accent-soft);color:var(--accent)}
.tag.late{background:var(--late-soft);color:var(--late)}
.tag.today{background:var(--today-soft);color:var(--today)}
.tag.none{background:#eeece4;color:var(--muted)}
.who{display:flex;gap:6px;flex:none}
.who button{width:44px;height:44px;border-radius:50%;font-weight:700;font-size:15px;display:grid;place-items:center;position:relative;transition:transform .12s}
.who button:active{transform:scale(.9)}
.who .m{background:var(--m-soft);color:var(--m)}
.who .f{background:var(--f-soft);color:var(--f)}
.who button .n{position:absolute;right:-3px;bottom:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;font-size:11px;line-height:19px;color:#fff;border:2px solid var(--card)}
.who .m .n{background:var(--m)} .who .f .n{background:var(--f)}
.who button.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
.add-card{border:1.5px dashed #cfcabb;background:transparent;justify-content:center;color:var(--muted);font-weight:500;padding:16px;width:100%;border-radius:var(--radius)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:15px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:14px}

/* score view */
h2.sec{font-size:22px;margin:20px 0 10px}
.seg{display:flex;background:#e9e6dc;border-radius:12px;padding:3px;margin-top:14px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0001}
.duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.duel .p{border-radius:var(--radius);padding:16px;text-align:left}
.duel .p span{font-size:14px;font-weight:600}
.duel .p b{display:block;font-family:Fraunces,serif;font-size:40px;line-height:1.1;margin-top:4px}
.duel .p small{font-size:13px;opacity:.8}
.duel .p.lead{outline:2.5px solid currentColor}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px}
.rrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .nm{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .mini{width:86px;height:7px;border-radius:99px;background:#eeece4;overflow:hidden;display:flex;flex:none}
.rrow .mini i{display:block;height:100%}
.num{font-weight:700;font-size:14px;width:24px;text-align:center;flex:none}

/* history */
.day{font-weight:600;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 7px}
.hrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .e{font-size:21px;width:28px;text-align:center}
.hrow .t{flex:1;min-width:0;font-size:15px}
.hrow .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.m{background:var(--m-soft);color:var(--m)} .pill.f{background:var(--f-soft);color:var(--f)}
.x{color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:50%}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf8f2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabtel{position:absolute;top:0;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--late);color:#fff;font-size:11px;line-height:18px}
nav.tabs button{flex:1;min-width:0;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:5px 0}
nav.tabs button span{font-size:22px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on span{filter:none;opacity:1}

/* sheet */
.shade{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.shade.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:31;max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
.grab{touch-action:none;padding:8px 0;margin-top:-8px;box-sizing:content-box;background-clip:content-box}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#cfcabb;margin:0 auto 14px}
.sheet h2{font-size:24px;margin-bottom:14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;font-size:22px;background:var(--card);border:1px solid var(--line)}
.emojis button.on{border:2px solid var(--accent);background:var(--accent-soft)}
.freq{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:block;width:100%;border-radius:14px;padding:14px 10px;font-weight:600;font-size:16px;text-align:center;margin-top:18px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{color:var(--late);margin-top:10px}
.pick2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pick2 button{padding:18px 10px;border-radius:16px;font-weight:700;font-size:17px;border:2px solid transparent}
.pick2 .m{background:var(--m-soft);color:var(--m)} .pick2 .f{background:var(--f-soft);color:var(--f)}
.pick2 button.on{border-color:currentColor}
.note{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:8px}
.note code{font-size:12px;background:#e9e6dc;padding:1px 5px;border-radius:5px;word-break:break-all}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 12px 11px 16px;border-radius:14px;font-size:14.5px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .2s;z-index:40;width:max-content;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#9fe0b6;font-weight:700;padding:4px 6px}
/* telefoonbreedte: icoon en knoppen iets compacter, meer ruimte voor de naam */
@media (max-width:460px){
  .card{padding:11px 9px 11px 10px;gap:6px}
  .card .main{gap:9px}
  .emoji{width:38px;height:38px;font-size:21px;border-radius:12px}
  .card .who{gap:5px}
  .card .who button{width:40px;height:40px;font-size:14px}
}
/* smal scherm of grote tekst: M/F-knoppen onder het klusje */
@media (max-width:380px){
  .card{flex-wrap:wrap}
  .card .main{flex-basis:100%}
  .card .who{width:100%;padding-left:55px;gap:8px}
  .card .who button{flex:1;height:40px;border-radius:12px}
}
textarea.inp{min-height:110px;resize:vertical;line-height:1.45}
.uitleg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;white-space:pre-wrap;line-height:1.5;font-size:15px;-webkit-user-select:text;user-select:text}
.uitleg.leeg{color:var(--muted);font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.btnrow{display:flex;gap:10px}.btnrow .btn{margin-top:14px}
.plan{display:block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--accent)}
.vandaag{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;margin-top:14px}
.vandaag h3{font-family:Inter,sans-serif;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:4px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .e{font-size:21px;width:28px;text-align:center}
.prow .t{flex:1;min-width:0;font-size:15px;text-align:left}
.prow .t small{display:block;color:var(--muted);font-size:12.5px}
.pill.s{background:#eeece4;color:var(--muted)}
.pill.late{background:var(--late-soft);color:var(--late)}
.fab{display:block;width:100%;margin-top:14px;background:var(--ink);color:#fff;border-radius:14px;padding:14px;font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.maanden{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.maanden button{padding:9px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.maanden button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seizoen-kop{margin:22px 2px 8px;font-weight:600;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.card.uit{opacity:.55}
.bk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:0}
.bk span{flex:1;font-size:15px}
.bk small{color:var(--muted);font-size:12.5px;display:block}
.bk button{font-weight:600;color:var(--accent);padding:6px 4px}
.zoek{position:relative;margin-top:14px}
.zoek input{width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none}
.zoek input:focus{border-color:var(--accent)}
.zoek .lup{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.55;pointer-events:none}
.zoek .wis{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.filters.cats{margin-top:12px}
.filters.stat{margin-top:8px}
.filters.stat .chip{padding:6px 11px;font-size:13px;background:transparent}
.filters.stat .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat-kop{display:flex;align-items:center;gap:8px;margin:20px 2px 2px;font-family:Fraunces,serif;font-size:19px;font-weight:700}
.cat-kop small{font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;color:var(--muted);background:#e9e6dc;border-radius:99px;padding:2px 8px}
.list .cat-kop:first-child{margin-top:4px}
.lijst-add{display:flex;gap:8px}
.lijst-add .inp{flex:1;padding:12px 14px}
.lijst-add button{flex:none;width:50px;border-radius:14px;background:var(--accent);color:#fff;font-size:24px;font-weight:600}
.litem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.litem:last-child{border-bottom:0}
.litem .vak{width:26px;height:26px;border-radius:8px;border:2px solid #cfcabb;display:grid;place-items:center;flex:none;font-size:15px;color:#fff;background:var(--card)}
.litem.af .vak{background:var(--accent);border-color:var(--accent)}
.litem .tx{flex:1;min-width:0;text-align:left;font-size:16px;overflow-wrap:break-word}
.litem.af .tx{text-decoration:line-through;color:var(--muted)}
.stap{display:flex;align-items:center;gap:2px;flex:none}
.stap button{width:30px;height:30px;border-radius:9px;background:#eeece4;font-size:18px;font-weight:700;color:var(--ink)}
.stap b{min-width:26px;text-align:center;font-size:15px}
.litem .aant{font-weight:700;color:var(--accent);margin-right:4px}
.lijst-wis{font-size:13.5px;font-weight:600;color:var(--late);padding:10px 0 2px}
.who.mini{gap:5px;flex:none}
.prow .t{min-width:0}
.who.mini button{width:38px;height:38px;font-size:14px}
.who.mini .m.toeg{box-shadow:0 0 0 2.5px var(--m)}
.who.mini .f.toeg{box-shadow:0 0 0 2.5px var(--f)}
.prow.af .t{color:var(--muted)}
.prow.af .e{opacity:.6}
.x.terug{font-size:19px;color:var(--accent);font-weight:700}
.card p .ptn{color:var(--ink);font-weight:600}
.rrow .re{font-size:20px;width:26px;text-align:center;flex:none}
.rrow .nm2{flex:1;min-width:0;font-size:15px;line-height:1.3;overflow-wrap:break-word}
.rrow .nm2 small{display:block;color:var(--muted);font-size:12.5px}
.rrow .rs{flex:none;width:76px;display:flex;flex-direction:column;gap:5px}
.rrow .rs .rn{display:flex;justify-content:space-between;font-size:15px}
.rrow .rs .mini{width:100%}
.duel .p small{display:block;line-height:1.35}
.card{-webkit-touch-callout:none}
.card.sleep{position:fixed;z-index:50;box-shadow:0 14px 34px #0003;transform:scale(1.03);transition:transform .12s;pointer-events:none}
.sleep-plek{border:2px dashed var(--accent);border-radius:var(--radius);background:var(--accent-soft)}
.card.houd{transition:transform .35s;transform:scale(.97)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="hi"><span class="dot" id="syncDot"></span><span id="hello">Hoi!</span></div>
    <h1 id="title">Klusjes</h1>
  </div>
  <button class="gear" id="gearBtn" aria-label="Instellingen">⚙️</button>
</header>

<main class="wrap">
  <!-- KLUSJES -->
  <section id="v-klusjes">
    <div class="strip" id="strip"></div>
    <div id="vandaag"></div>
    <div class="zoek"><span class="lup">🔍</span><input id="zoek" type="text" enterkeyhint="search" placeholder="Zoek een klusje of uitleg…" autocomplete="off"><button class="wis hidden" id="zoekWis" aria-label="Wissen">×</button></div>
    <div class="filters cats" id="cats"></div>
    <div class="filters stat" id="filters"></div>
    <div class="list" id="list"></div>
    <p class="hint">Tik op <b>M</b> of <b>F</b> als die het klusje gedaan heeft. Tik op een klusje voor uitleg, inplannen of aanpassen. <b>Houd een klusje vast</b> om het te verslepen.</p>
  </section>

  <!-- BOODSCHAPPEN -->
  <section id="v-boodschappen" class="hidden">
    <div id="bsWidget" style="margin-top:14px"></div>
    <div id="bsKlaar"></div>
  </section>

  <!-- PLANNING -->
  <section id="v-planning" class="hidden">
    <button class="fab" data-plan="">📅 Klusje inplannen</button>
    <div id="planlist"></div>
  </section>

  <!-- SCORE -->
  <section id="v-score" class="hidden">
    <div class="seg" id="seg"></div>
    <div class="duel" id="duel"></div>
    <h2 class="sec">Per klusje</h2>
    <div class="rows" id="perKlus"></div>
  </section>

  <!-- HISTORIE -->
  <section id="v-historie" class="hidden">
    <div id="hist"></div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="klusjes" class="on"><span>✅</span>Klusjes</button>
  <button data-tab="boodschappen" style="position:relative"><span>🛒</span>Boodschappen<b id="tabTel" class="tabtel hidden"></b></button>
  <button data-tab="planning" style="position:relative"><span>📅</span>Planning<b id="tabPlan" class="tabtel hidden"></b></button>
  <button data-tab="score"><span>🏆</span>Score</button>
  <button data-tab="historie"><span>📜</span>Historie</button>
</nav>

<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Ongedaan</button></div>

<script src="config.js"></script>
<script>
"use strict";
const CFG = window.KLUSJES_CONFIG;
const P = CFG.PERSONEN;
const WIE = ["maarten", "femke"];
const LS = k => "klusjes:" + k;
const $ = s => document.querySelector(s);

/* ---------- automatisch bijwerken: nieuwe versie online? dan verversen ---------- */
async function checkVersie() {
  try {
    const r = await fetch("versie.json?t=" + Date.now(), { cache: "no-store" });
    const v = (await r.json()).v;
    const bezig = $("#sheet").classList.contains("open") || ["INPUT", "TEXTAREA", "SELECT"].includes((document.activeElement || {}).tagName) || slepen;
    if (v && v !== VERSIE && bezig) { setTimeout(checkVersie, 30000); return; }   // later nog eens
    if (v && v !== VERSIE) {
      const n = +(sessionStorage.getItem("klusjes:reload") || 0);
      if (n < 2) { sessionStorage.setItem("klusjes:reload", n + 1); location.reload(); }
    } else sessionStorage.removeItem("klusjes:reload");
  } catch {}
}
async function hardBijwerken() {
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
  location.replace(location.pathname + "?v=" + Date.now());
}

/* ---------- opslag ---------- */
function load(k, d) { try { const v = localStorage.getItem(LS(k)); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch {} }

/* ---------- data-model helpers (paden zoals "log/abc") ---------- */
function setPath(obj, path, val) {
  const parts = path.split("/").filter(Boolean);
  if (!parts.length) return val && typeof val === "object" ? val : {};
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!o[parts[i]] || typeof o[parts[i]] !== "object") o[parts[i]] = {};
    o = o[parts[i]];
  }
  const last = parts[parts.length - 1];
  if (val === null || val === undefined) delete o[last]; else o[last] = val;
  return obj;
}
function rebuild() {
  data = JSON.parse(JSON.stringify(server || {}));
  for (const op of pending) setPath(data, op.p, op.m === "DELETE" ? null : op.d);
  data.klusjes = data.klusjes || {};
  data.log = data.log || {};
  for (const [id, k] of Object.entries(data.klusjes)) if (!k || typeof k !== "object" || typeof k.naam !== "string") delete data.klusjes[id];
  for (const [id, e] of Object.entries(data.log)) if (!e || typeof e.t !== "number") delete data.log[id];
  if (data.planning) for (const [id, x] of Object.entries(data.planning)) if (!x || typeof x.datum !== "string") delete data.planning[id];
  data.instellingen = data.instellingen || {};
  data.planning = data.planning || {};
  data.backups = data.backups || {};
  data.lijsten = data.lijsten || {};
  data.volgorde = data.volgorde || {};
}
// Eerlijke verdeling: welk deel van de klusjes Maarten als doel heeft (Femke de rest).
const aandeelM = () => { const v = data.instellingen.aandeelM; return typeof v === "number" ? v : 40; };
function eerlijk(c) {
  const tot = c.maarten + c.femke, tM = aandeelM() / 100;
  const verschil = c.maarten - tot * tM;          // + = Maarten doet meer dan zijn deel
  const r = Math.round(Math.abs(verschil));
  let tekst = "Precies volgens afspraak 👌", wie = null;
  if (!tot) tekst = "Nog niks gedaan";
  else if (r >= 1) { wie = verschil > 0 ? "maarten" : "femke";
    const ander = wie === "maarten" ? "femke" : "maarten";
    tekst = `${P[ander].naam} loopt ${r} punt${r > 1 ? "en" : ""} achter`; }
  return { tot, tM, verschil, tekst, wie };
}
function schoon(v) { if (v && typeof v === "object" && !Array.isArray(v)) { const o = {}; for (const [a, b] of Object.entries(v)) if (b !== null && b !== undefined) o[a] = schoon(b); return o; } return v; }
function write(path, val) {
  val = schoon(val);
  pending.push(val === null ? { m: "DELETE", p: path, u: 1 } : { m: "PUT", p: path, d: val, u: 1 });
  save("pending", pending);
  rebuild(); render(); flush();
}

/* ---------- synchronisatie (Firebase Realtime Database via REST + live stream) ---------- */
let es = null, flushing = false, online = false, retryT = null;
const base = () => url() + "/huishoudens/" + encodeURIComponent(code());

function getPath(obj, path) {
  let o = obj;
  for (const k of path.split("/").filter(Boolean)) { if (!o || typeof o !== "object") return undefined; o = o[k]; }
  return o;
}
// Standaard-klusjes (ook uit oudere versies, toen er nog geen uitleg-veld was) mogen nooit iets
// overschrijven dat al in de database staat: alleen toevoegen als het klusje nog niet bestaat.
const isSeed = op => !!op.seed || (!op.u && op.m === "PUT" && /^klusjes\/s-[^/]+$/.test(op.p) && op.d && typeof op.d === "object" && !("uitleg" in op.d));
function dropStaleSeeds() {
  const voor = pending.length;
  const heeftKlusjes = server.klusjes && Object.keys(server.klusjes).length > 0;
  // Standaardlijst alleen gebruiken voor een lege database (anders komen verwijderde klusjes terug).
  // Nieuwe voorbeeldklusjes ("nieuw") alleen toevoegen als ze nog niet bestaan.
  pending = pending.filter(op => !isSeed(op) || (op.seed === "nieuw" ? getPath(server, op.p) === undefined : !heeftKlusjes));
  if (pending.length !== voor) save("pending", pending);
}
let loaded = false;   // pas versturen als de actuele stand van de database binnen is

async function flush() {
  if (!url() || flushing || !pending.length || !loaded) return;
  dropStaleSeeds();
  if (!pending.length) return;
  flushing = true;
  try {
    while (pending.length) {
      const op = pending[0];
      const r = await fetch(base() + "/" + op.p + ".json", {
        method: op.m, body: op.m === "PUT" ? JSON.stringify(op.d) : undefined
      });
      if (r.status === 400) { pending.shift(); save("pending", pending); continue; }   // ongeldige wijziging: overslaan
      if (!r.ok) throw new Error("HTTP " + r.status);                                  // bv. geen internet/regels: later opnieuw
      setPath(server, op.p, op.m === "DELETE" ? null : op.d);
      pending.shift();
      save("pending", pending); save("server", server);
    }
  } catch (e) {
    clearTimeout(retryT); retryT = setTimeout(flush, 6000);
  } finally { flushing = false; }
}

function connect() {
  if (es) { es.close(); es = null; }
  loaded = false;
  setDot();
  if (!url()) return;
  es = new EventSource(base() + ".json");
  const onData = (kind) => (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg) return;
    if (kind === "put") {
      if (msg.path === "/") server = msg.data || {};
      else setPath(server, msg.path, msg.data);
    } else {
      for (const [k, v] of Object.entries(msg.data || {})) setPath(server, msg.path.replace(/\/$/, "") + "/" + k, v);
    }
    online = true; setDot();
    save("server", server);
    if (kind === "put" && msg.path === "/") { loaded = true; dropStaleSeeds(); }
    seedIfEmpty(); migreer(); migreer2(); migreer3(); migreer4(); migreer5(); migreer6(); migreer7(); migreer8(); migreer9(); migreer10(); migreer11(); maakBackup();
    rebuild(); render(); flush();
  };
  es.addEventListener("put", onData("put"));
  es.addEventListener("patch", onData("patch"));
  es.addEventListener("cancel", () => { online = false; setDot("Geen toegang tot database (regels?)"); });
  es.onopen = () => { online = true; setDot(); flush(); };
  es.onerror = () => { online = false; loaded = false; setDot(); };
}
window.addEventListener("online", () => { flush(); if (!es || es.readyState === 2) connect(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { checkVersie(); flush(); if (!es || es.readyState === 2) connect(); }
});

function setDot(msg) {
  const d = $("#syncDot");
  d.className = "dot" + (!url() ? "" : online ? " live" : " off");
  d.title = msg || (!url() ? "Alleen op dit toestel" : online ? "Live gekoppeld" : "Offline – wordt later verstuurd");
}

/* ---------- back-up: elke dag een kopie in de database (laatste 14 dagen) ---------- */
function maakBackup() {
  if (!loaded || !server.klusjes || !Object.keys(server.klusjes).length) return;
  const dag = vandaagKey(), b = server.backups || {};
  if (b[dag] || pending.some(op => op.p === "backups/" + dag)) return;
  for (const [id, x] of Object.entries(server.planning || {})) if (x && x.gedaan && x.gedaan.t < Date.now() - 30 * DAG) write("planning/" + id, null);
  write("backups/" + dag, { t: Date.now(), door: me || "?", klusjes: server.klusjes, planning: server.planning || null, instellingen: { aandeelM: server.instellingen?.aandeelM ?? null } });
  Object.keys(b).sort().slice(0, Math.max(0, Object.keys(b).length - 13)).forEach(oud => write("backups/" + oud, null));
}
// Herstellen vult alleen aan: ontbrekende klusjes terug, verdwenen uitleg terug. Er wordt nooit iets gewist.
function herstel(bk) {
  if (!bk || !bk.klusjes) return 0;
  let n = 0;
  for (const [id, k] of Object.entries(bk.klusjes)) {
    const nu = data.klusjes[id];
    if (!nu) { write("klusjes/" + id, k); n++; }
    else if (k.uitleg && !(nu.uitleg || "").trim()) { write("klusjes/" + id + "/uitleg", k.uitleg); n++; }
  }
  for (const [id, x] of Object.entries(bk.planning || {})) if (!data.planning[id] && !x.gedaan && x.datum >= vandaagKey()) { write("planning/" + id, x); n++; }
  for (const [id, e] of Object.entries(bk.log || {})) if (!data.log[id]) { write("log/" + id, e); n++; }
  return n;
}
const IN_APP = /; wv\)/.test(navigator.userAgent);

  const naam = "klusjes-backup-" + vandaagKey() + ".json";
  try {
    const f = new File([json], naam, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: "Klusjes back-up" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  if (IN_APP) {     // Android-app: downloaden kan daar niet
    try { await navigator.clipboard.writeText(json); toast("Back-up gekopieerd. Plak hem in een notitie of mail."); return; } catch {}
    openSheet(`<h2>Back-up</h2><p class="note">Houd de tekst ingedrukt, kies <b>Alles selecteren</b> en dan <b>Kopiëren</b>. Plak hem in een notitie of mail aan jezelf.</p>

/* ---------- berekeningen ---------- */
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

const STANDAARD_PUNTEN = {
  // 1 punt · ± 5 min
  "s-wittewas": 1, "s-normalewas": 1, "s-handdoeken": 1, "s-droger": 1, "s-stofzuigenbeneden": 1,
  "s-vaatwasser": 1, "s-spiegel": 1, "s-containers": 1, "s-plantenwater": 1, "s-rookmelder": 1, "s-cvbijvullen": 1, "s-ruitenwisser": 1, "s-buitenkraan": 1,
  // 2 punten · ± 15 min
  "s-ophangen": 2, "s-stofzuigen": 2, "s-vouwen": 2, "s-wc": 2, "s-afstoffen": 2, "s-badmeubel": 2, "s-autostofzuigen": 2,
  "s-containersschoon": 2, "s-stoep": 2, "s-afzuigkap": 2, "s-radiatoren": 2,
  // 3 punten · ± 30 min
  "s-dweilen": 3, "s-koelkast": 3, "s-tuinmeubels": 3, "s-bladeren": 3, "s-onkruid": 3,

  "s-strijken": 4, "s-boodschappen": 4, "s-oven": 4, "s-ramen": 4, "s-dakgoot": 4, "s-autowassen": 4, "s-siergrassen": 4,
  // 5 punten · 1,5 uur of meer
  "s-vriezer": 5, "s-ramenbuiten": 5,
};
const puntenVan = (k, id) => (k && k.punten >= 1 && k.punten <= 5) ? k.punten : (STANDAARD_PUNTEN[id] || 2);
// punten van één afvinking: vastgelegd op het moment van afvinken (of anders de huidige waarde van het klusje)
const puntenLog = e => (e.p >= 1 && e.p <= 5) ? e.p : puntenVan(data.klusjes[e.k], e.k);
function punten(since, kid) {
  const c = { maarten: 0, femke: 0 };

  return c;
}

function counts(since, kid) {
  const c = { maarten: 0, femke: 0 };

}
function status(k, kid) {
  const last = lastDone(kid);
  if (seizoen(k)) {
    if (!inSeizoen(k)) return { order: 2e9, label: "Weer in " + volgendeSeizoenMaand(k), cls: "none", last, uit: true };
    const start = seizoenStart(k);
    if (!k.elke) return { order: 9e8, label: "Wanneer nodig", cls: "none", last };
    if (k.elke >= 30) {
      if (!last || last.t < start) return { order: -5e5, label: "Dit seizoen", cls: "today", last };
      if (startOfDay(last.t) + k.elke * DAG > Date.now()) return { order: 8e8, label: "Gedaan ✓", cls: "", last };
    } else if (!last || last.t < start) return { order: -1e6, label: "Nog niet gedaan", cls: "late", last };
  }
  if (!k.elke) return { order: 9e9, label: "Wanneer nodig", cls: "none", last };
  if (!last) return k.elke > 14
    ? { order: 5e8, label: "Nog niet gedaan", cls: "none", last }
    : { order: -1e6, label: "Nog niet gedaan", cls: "late", last };

  if (diff < 0) return { order: diff, label: (-diff) + (diff === -1 ? " dag" : " dagen") + " te laat", cls: "late", last };

  if (d === 1) return "gisteren";

const FREQ = [[1, "Elke dag"], [2, "Om de dag"], [3, "Elke 3 dagen"], [7, "Elke week"], [14, "Om de week"], [30, "Elke maand"], [61, "Elke 2 maanden"], [91, "Elk kwartaal"], [182, "Elk half jaar"], [365, "Elk jaar"], [0, "Wanneer nodig"]];

const isPeriodiek = k => !k.elke || k.elke > 14 || seizoen(k);
const MND = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const MND_LANG = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const seizoen = k => Array.isArray(k.maanden) && k.maanden.length > 0 && k.maanden.length < 12;
const inSeizoen = (k, d = new Date()) => !seizoen(k) || k.maanden.includes(d.getMonth() + 1);
// begin van het huidige seizoen: terug in de tijd tot de eerste maand van dit aaneengesloten blok
function seizoenStart(k) {
  const d = new Date(); let y = d.getFullYear(), m = d.getMonth();
  for (let i = 0; i < 11; i++) { const pm = (m + 11) % 12; if (!k.maanden.includes(pm + 1)) break; if (pm === 11) y--; m = pm; }

}

  return "";
}
const seizoenTxt = k => seizoen(k) ? [...k.maanden].sort((a, b) => a - b).map(n => MND[n - 1]).join(", ") : "";
const dkey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const vandaagKey = () => dkey(Date.now());
const keyToTime = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };

// Een gepland klusje is afgevinkt zolang de bijbehorende afvinking in het logboek staat.

const isGedaan = x => !!(x.gedaan && x.gedaan.log && data.log[x.gedaan.log]);

let tab = "klusjes", periode = "week", filter = "alles", cat = "alles", zoek = "";
const FILTERS = [["alles", "Alles"], ["nu", "Nu te doen"], ["week", "Wekelijks"], ["periodiek", "Periodiek"]];
const CATS = [["was", "🧺", "Was"], ["schoonmaak", "🧽", "Schoonmaak"], ["keuken", "🍽️", "Keuken"], ["buiten", "🌳", "Buiten"], ["auto", "🚗", "Auto"], ["techniek", "🔧", "Techniek"], ["overig", "📦", "Overig"]];

  $("#seg").innerHTML = PER.map(([k, l]) => `<button class="${periode === k ? "on" : ""}" data-per="${k}">${l}</button>`).join("");
  const since = periodStart(periode);
  const c = punten(since); const tot = c.maarten + c.femke;
  const aantal = counts(since);
  const e = eerlijk(c);
  const card = w => {
    const pct = tot ? Math.round(c[w] / tot * 100) : 0;
    const doel = w === "maarten" ? aandeelM() : 100 - aandeelM();
    const top = e.wie === w;
    return `<div class="p ${top ? "lead" : ""}" style="background:${P[w].zacht};color:${P[w].kleur}">
      <span>${P[w].naam}${top ? " 👑" : ""}</span><b>${c[w]} <span style="font-size:15px;font-family:Inter,sans-serif;font-weight:600">pt</span></b><small>${aantal[w]} klusje${aantal[w] === 1 ? "" : "s"}${tot ? " · " + pct + "%" : ""}<br>doel ${doel}%</small></div>`;
  };
  $("#duel").innerHTML = card("maarten") + card("femke") +
    `<p class="note" style="grid-column:1/-1;margin:2px 2px 0">Eerlijk volgens afspraak ${aandeelM()}/${100 - aandeelM()}: <b>${e.tekst}</b>. Klusjes die meer tijd kosten, leveren meer punten op. De kroon gaat naar wie meer doet dan zijn/haar deel.</p>`;
  const rows = Object.entries(data.klusjes).map(([id, k]) => ({ id, k, c: counts(since, id) }))
    .filter(r => r.c.maarten + r.c.femke > 0)
    .sort((a, b) => (b.c.maarten + b.c.femke) - (a.c.maarten + a.c.femke));
  $("#perKlus").innerHTML = rows.length ? rows.map(({ id, k, c }) => {
    const t = c.maarten + c.femke;
    return `<div class="rrow"><span class="re">${esc(k.emoji)}</span>
      <span class="nm2">${esc(k.naam)}</span>
      <span class="rs"><span class="rn"><b style="color:${P.maarten.kleur}">${c.maarten}</b><b style="color:${P.femke.kleur}">${c.femke}</b></span>
      <span class="mini"><i style="width:${c.maarten / t * 100}%;background:${P.maarten.kleur}"></i><i style="width:${c.femke / t * 100}%;background:${P.femke.kleur}"></i></span></span></div>`;
  }).join("") : `<div class="empty">Nog niks afgevinkt in deze periode.</div>`;
}

function renderHist() {
  const list = logList().slice(0, 300);
  if (!list.length) { $("#hist").innerHTML = `<div class="empty">Nog niks afgevinkt. Het logboek vult zich vanzelf.</div>`; return; }
  let html = "", day = null;
  for (const e of list) {
    const d = startOfDay(e.t);
    if (d !== day) {
      if (day !== null) html += `</div>`;
      day = d;
      const diff = Math.round((startOfDay(Date.now()) - d) / DAG);
      const lbl = diff === 0 ? "Vandaag" : diff === 1 ? "Gisteren" : new Date(d).toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
      html += `<div class="day">${lbl}</div><div class="rows">`;
    }
    const k = data.klusjes[e.k] || { naam: e.n || "Verwijderd klusje", emoji: "🗂️" };
    const tijd = new Date(e.t).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    const uitPlan = Object.values(data.planning).some(x => x && x.gedaan && x.gedaan.log === e.id);
    html += `<div class="hrow"><span class="e">${esc(k.emoji)}</span><span class="t">${esc(k.naam)}<small>${tijd} · +${puntenLog(e)} pt${uitPlan ? " · 📅 uit planning" : ""}</small></span>
      <span class="pill ${e.w === "maarten" ? "m" : "f"}">${esc(P[e.w]?.naam || "?")}</span>
      <button class="x" data-del="${e.id}" aria-label="Verwijderen">×</button></div>`;
  }
  $("#hist").innerHTML = html + `</div>`;
}

/* ---------- acties ---------- */
let undoPlan = null, undoId = null, toastT = null;
function done(kid, wie, btn, pid) {
  const k = data.klusjes[kid]; if (!k) return;
  const id = uid();
  const pt = puntenVan(k, kid);
  write("log/" + id, { k: kid, w: wie, t: Date.now(), n: k.naam, p: pt, door: me || wie });
  // afgevinkt vanuit de planning: precies dat item weghalen, anders het eerstvolgende binnen een week
  const pl = pid ? planList(kid).find(x => x.id === pid) : planList(kid).find(x => x.datum <= dkey(Date.now() + 7 * DAG));
  if (pl) write("planning/" + pl.id + "/gedaan", { w: wie, t: Date.now(), log: id });
  undoPlan = pl ? { id: pl.id } : null;
  if (navigator.vibrate) navigator.vibrate(25);
  const b = document.querySelector(`[data-done="${kid}"][data-wie="${wie}"]`);
  if (b) b.classList.add("pop");
  undoId = id;
  toast(`${k.emoji} ${k.naam} – ${P[wie].naam} +${pt} pt`);
  if ($("#sheet").classList.contains("open") && $("#dPlan")) detailSheet(kid, true);   // venster van dit klusje verversen
}
function toast(msg) {
  $("#toastMsg").textContent = msg;
  $("#toast").classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => $("#toast").classList.remove("show"), 4500);
}
$("#toastUndo").onclick = () => {
  if (undoId) write("log/" + undoId, null);
  if (undoId && undoPlan) write("planning/" + undoPlan.id + "/gedaan", null);
  undoId = null; undoPlan = null; $("#toast").classList.remove("show");
};

/* ---------- sheets ---------- */
const EMOJIS = ["🤍","👔","🪞","🪶","🧊","🧖","🧹","🪣","🧽","🛁","🚽","🍽️","🍳","🧺","👕","🗑️","♻️","🛒","🛏️","🪴","🐾","🚗","🪟","🧼","🍰","🔧","📬","💡","🌿","❄️","🔥","🍰","🚨","♨️","🚗","🌱","✂️","💧","🍂","🌀","⚡","🥣","🥫","🧱","🌼","🛢️","📷"];

function openSheet(html, houdToast) {
  if (!houdToast) $("#toast").classList.remove("show");
  // terugknop (Android) sluit het venster
  if (!$("#sheet").classList.contains("open")) { try { history.pushState({ sheet: 1 }, ""); } catch {} }
  $("#sheet").innerHTML = `<div class="grab"></div>` + html; $("#sheet").scrollTop = 0;
  $("#sheet").classList.add("open"); $("#shade").classList.add("open");
}
function closeSheet(viaTerug) {
  if (!$("#sheet").classList.contains("open")) return;
  $("#sheet").classList.remove("open"); $("#shade").classList.remove("open");
  if (viaTerug !== true && history.state && history.state.sheet) { try { history.back(); } catch {} }
}
window.addEventListener("popstate", () => closeSheet(true));
$("#shade").onclick = () => closeSheet();

// naar beneden vegen om te sluiten
(() => {
  const sh = $("#sheet"); let start = null, dy = 0;
  sh.addEventListener("touchstart", e => {
    if (sh.scrollTop > 2 && !e.target.closest(".grab")) { start = null; return; }
    if (e.target.closest("input,textarea,select")) { start = null; return; }
    start = e.touches[0].clientY; dy = 0; sh.style.transition = "none";
  }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (start === null) return;
    dy = e.touches[0].clientY - start;
    if (dy <= 0 || (sh.scrollTop > 2 && !e.target.closest(".grab"))) { dy = 0; sh.style.transform = ""; return; }
    sh.style.transform = `translateY(${dy}px)`;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  const eind = () => {
    if (start === null) return;
    sh.style.transition = ""; sh.style.transform = "";
    if (dy > 90) closeSheet();
    start = null; dy = 0;
  };
  sh.addEventListener("touchend", eind); sh.addEventListener("touchcancel", eind);
})();

  $("#kFreq").onclick = e => { const b = e.target.closest("[data-n]"); if (!b) return; elke = +b.dataset.n; $("#kFreq").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
  $("#kPt").onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; pt = +b.dataset.p; $("#kPt").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
  $("#kCat").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; kcat = b.dataset.c; $("#kCat").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
  $("#kMnd").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; const m = +b.dataset.m;
    maanden = maanden.includes(m) ? maanden.filter(x => x !== m) : [...maanden, m]; b.classList.toggle("on", maanden.includes(m)); };
  $("#kSave").onclick = () => {

      maanden: maanden.length && maanden.length < 12 ? maanden.sort((a, b) => a - b) : null, v: huidig.v ?? k.v ?? Object.keys(data.klusjes).length });

/* ---------- lijstje bij een klusje (bijv. boodschappen) ---------- */
const heeftLijst = (k) => !!k && (k.lijst || /boodschap/i.test(k.naam || ""));
function lijstItems(kid) {
  return Object.entries(data.lijsten[kid] || {}).map(([id, x]) => ({ id, ...x })).filter(x => typeof x.tekst === "string")
    .sort((a, b) => (a.af ? 1 : 0) - (b.af ? 1 : 0) || (a.t || 0) - (b.t || 0));
}
// het klusje waar het boodschappenlijstje bij hoort
function boodschappenId() {
  const e = Object.entries(data.klusjes).find(([id, k]) => /boodschap/i.test(k.naam || ""));
  return e ? e[0] : "s-boodschappen";
}
const lijstWidget = (kid) => `<div class="lijstw" data-kid="${kid}">
  <div class="lijst-add"><input class="inp lijstIn" placeholder="Bijv. 2 melk, brood, kaas" enterkeyhint="done" autocomplete="off" maxlength="200"><button class="lijstOk" aria-label="Toevoegen">+</button></div>
  <div class="lijstBox" style="margin-top:10px"></div></div>`;
function renderLijst() {
  document.querySelectorAll(".lijstw").forEach(w => vulLijst(w.querySelector(".lijstBox"), w.dataset.kid));
  // teller op het tabblad
  const n = lijstItems(boodschappenId()).filter(x => !x.af).length, tb = $("#tabTel");
  if (tb) { tb.textContent = n; tb.classList.toggle("hidden", !n); }
  // planning: wat vandaag (of eerder) gepland staat en nog niet gedaan is
  const np = planList().filter(x => x.datum <= vandaagKey()).length, tp = $("#tabPlan");
  if (tp) { tp.textContent = np; tp.classList.toggle("hidden", !np); }
}
function vulLijst(box, kid) {
  const items = lijstItems(kid), af = items.filter(x => x.af).length;
  box.innerHTML = (items.length ? `<div class="rows" style="padding:0 14px">${items.map(x =>
      `<div class="litem ${x.af ? "af" : ""}"><button class="vak" data-li="${x.id}">${x.af ? "✓" : ""}</button>
        <button class="tx" data-li="${x.id}">${x.af && (x.aantal || 1) > 1 ? `<span class="aant">${x.aantal}×</span>` : ""}${esc(x.tekst)}</button>
        ${x.af ? "" : `<span class="stap"><button data-lmin="${x.id}" aria-label="Minder">−</button><b>${x.aantal || 1}</b><button data-lplus="${x.id}" aria-label="Meer">+</button></span>`}
        <button class="x" data-ldel="${x.id}" aria-label="Weghalen">×</button></div>`).join("")}</div>`
    : `<p class="note" style="margin-top:4px">Lijstje is leeg.</p>`)
    + (af ? `<button class="lijst-wis" data-lwis>Afgevinkte weghalen (${af})</button>` : "");
}
function lijstToevoegen(kid, inp) {
  const tekst = inp.value.trim(); if (!tekst) return;
  for (const t of tekst.split(/\n|,(?!\d)/).map(x => x.trim()).filter(Boolean)) {   // meerdere tegelijk met komma's (niet in 1,5)
    // aantal herkennen: "2 melk", "2x melk", "melk 2", "melk 2x"
    let m, aantal = 1, naam = t;
    const EENHEID = /^(gr|gram|g|kg|kilo|l|liter|ml|cl|dl|ons|pond|cm|m|meter)\b/i;   // "500 gram gehakt" is geen aantal
    if ((m = t.match(/^(\d{1,3})\s*[x×]?\s+(.+)$/i)) && !EENHEID.test(m[2])) { aantal = +m[1]; naam = m[2]; }
    else if ((m = t.match(/^(.+?)\s+[x×]?\s*(\d{1,3})\s*[x×]?$/i))) { aantal = +m[2]; naam = m[1]; }
    aantal = Math.max(1, Math.min(99, aantal)); naam = naam.trim().slice(0, 80);
    // staat het er al (niet afgevinkt)? dan aantal ophogen in plaats van dubbel
    const al = lijstItems(kid).find(x => !x.af && x.tekst.toLowerCase() === naam.toLowerCase());
    if (al) write("lijsten/" + kid + "/" + al.id + "/aantal", Math.min(99, (al.aantal || 1) + aantal));
    else write("lijsten/" + kid + "/" + uid(), { tekst: naam, aantal, af: false, t: Date.now(), door: me || "?" });
  }
  inp.value = ""; inp.focus();
}

  };
}

function plakSheet() {
  openSheet(`<h2>Back-up terugzetten</h2><p class="note">Plak hier de tekst van een eerder bewaarde back-up.</p>
    <textarea class="inp" id="plak" style="min-height:200px;font-size:12px" placeholder='{"app":"klusjes", …'></textarea>
    <button class="btn primary" id="plakOk">Herstellen</button>`);
  $("#plakOk").onclick = () => {
    try { const bk = JSON.parse($("#plak").value); if (!bk.klusjes) throw 0;
      const n = herstel(bk); closeSheet(); toast(n ? `${n} ding(en) hersteld ✓` : "Niks te herstellen, alles staat er nog ✓");
    } catch { alert("Dit is geen geldige Klusjes-back-up."); }
  };
}

function settingsSheet(first) {
  const rules = `{\n  "rules": {\n    "huishoudens": {\n      "${code()}": { ".read": true, ".write": true }\n    }\n  }\n}`;
  openSheet(`<h2>${first ? "Wie ben jij?" : "Instellingen"}</h2>
    <div class="pick2" id="meP">${WIE.map(w => `<button class="${w === "maarten" ? "m" : "f"} ${me === w ? "on" : ""}" data-me="${w}">${P[w].naam}</button>`).join("")}</div>
    <p class="note">Dit bepaalt alleen de begroeting. Afvinken doe je altijd met de M- of F-knop, dus je kunt ook voor de ander aankruisen.</p>
    ${first ? "" : `
    <label class="f">Eerlijke verdeling</label>
    <div class="rows" style="padding:12px 14px">
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px"><span style="color:${P.maarten.kleur}" id="aM">${P.maarten.naam} ${aandeelM()}%</span><span style="color:${P.femke.kleur}" id="aF">${100 - aandeelM()}% ${P.femke.naam}</span></div>
      <input type="range" id="aandeel" min="20" max="80" step="5" value="${aandeelM()}" style="width:100%;margin-top:10px;accent-color:var(--accent)">
    </div>
    <p class="note">Wie meer tijd heeft, doet een groter deel. Het scorebord kijkt of ieder zijn eigen deel haalt. Geldt voor jullie allebei.</p>
    <label class="f">Koppeling tussen de telefoons</label>
    <p class="note">${url() ? (online ? "🟢 Live gekoppeld." : "🟠 Gekoppeld, maar nu geen verbinding. Afvinken wordt later verstuurd.") : "⚪ Nog niet gekoppeld: alles staat alleen op dit toestel."}
    ${url() && pending.length ? `<br>${pending.length} wijziging(en) wachten op verzending.` : ""}</p>
    <label class="f">Database-adres (alleen invullen als het niet al werkt)</label>
    <input class="inp" id="dbUrl" value="${esc(load("dbUrl", ""))}" placeholder="${esc(CFG.FIREBASE_URL || "https://…firebasedatabase.app")}" inputmode="url" autocapitalize="off" autocorrect="off">
    <p class="note">Huis-code: <code>${esc(code())}</code></p>
    <button class="btn ghost" id="dbSave">Koppeling opslaan</button>
    <label class="f">App</label>
    <p class="note" style="margin-top:0">Versie ${VERSIE}. De app werkt zichzelf bij, maar zie je iets nieuws niet? Tik dan hieronder.</p>
    <button class="btn ghost" id="hardUpd" style="margin-top:8px">🔄 App bijwerken</button>
    <label class="f">Back-ups</label>
    <p class="note" style="margin-top:0">Elke dag wordt automatisch een kopie bewaard (laatste 14 dagen). Herstellen zet verdwenen klusjes en verdwenen uitleg terug. Er wordt nooit iets gewist of overschreven.</p>
    <div class="rows" style="padding:2px 14px">${Object.entries(data.backups).sort((a, b) => b[0].localeCompare(a[0])).map(([d, bk]) =>
      `<div class="bk"><span>${dagNaam(d)}<small>${Object.keys(bk.klusjes || {}).length} klusjes · ${Object.values(bk.klusjes || {}).filter(x => x.uitleg).length} met uitleg</small></span><button data-restore="${d}">Herstellen</button></div>`).join("") || `<div class="bk"><span><small>Nog geen back-up. Die wordt gemaakt zodra de app gekoppeld is.</small></span></div>`}</div>
    <div class="btnrow"><button class="btn ghost" id="bkExport">⬇️ Back-up bewaren</button><button class="btn ghost" id="bkImport">⬆️ Uit bestand</button></div>
    <input type="file" id="bkFile" accept=".json,application/json" class="hidden">
    <details style="margin-top:14px"><summary class="note" style="cursor:pointer">Database-regels voor Firebase</summary><p class="note"><code style="white-space:pre;display:block;padding:10px">${esc(rules)}</code></p></details>`}`);
  $("#meP").onclick = e => {
    const b = e.target.closest("[data-me]"); if (!b) return;
    me = b.dataset.me; save("ik", me);
    $("#meP").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    render(); if (first) setTimeout(closeSheet, 250);
  };
  if (!first) {
    const sl = $("#aandeel");
    sl.oninput = () => { $("#aM").textContent = P.maarten.naam + " " + sl.value + "%"; $("#aF").textContent = (100 - sl.value) + "% " + P.femke.naam; };
    sl.onchange = () => write("instellingen/aandeelM", +sl.value);
  }
  if (!first) {
    $("#sheet").querySelectorAll("[data-restore]").forEach(b => b.onclick = () => {
      const d = b.dataset.restore;
      if (!confirm(`Verdwenen klusjes en uitleg herstellen uit de back-up van ${dagNaam(d).toLowerCase()}?`)) return;
      const n = herstel(data.backups[d]); closeSheet(); toast(n ? `${n} ding(en) hersteld ✓` : "Niks te herstellen, alles staat er nog ✓");
    });
    $("#bkExport").onclick = exporteer;
    $("#hardUpd").onclick = hardBijwerken;
    $("#bkImport").onclick = () => IN_APP ? plakSheet() : $("#bkFile").click();
    $("#bkFile").onchange = async () => {
      const f = $("#bkFile").files[0]; if (!f) return;
      try { const bk = JSON.parse(await f.text()); if (!bk.klusjes) throw 0;
        if (!confirm(`Verdwenen klusjes en uitleg herstellen uit dit bestand?`)) return;
        const n = herstel(bk); closeSheet(); toast(n ? `${n} ding(en) hersteld ✓` : "Niks te herstellen, alles staat er nog ✓");
      } catch { alert("Dit is geen geldige Klusjes-back-up."); }
    };
  }
  if (!first) $("#dbSave").onclick = () => {
    save("dbUrl", $("#dbUrl").value.trim());
    server = {}; save("server", server); seeded = false; save("seeded", false);
    connect(); rebuild(); render(); closeSheet();
  };
}

/* ---------- events ---------- */
document.body.addEventListener("click", e => {
  const t = e.target.closest("[data-heropen],[data-cat],[data-done],[data-edit],[data-open],[data-plan],[data-unplan],[data-add],[data-filter],[data-per],[data-del],[data-tab]");
  if (!t) return;
  if (t.dataset.done) return done(t.dataset.done, t.dataset.wie, t, t.dataset.pid);
  if (t.dataset.edit) return editSheet(t.dataset.edit);
  if (t.dataset.open) return detailSheet(t.dataset.open);
  if (t.hasAttribute("data-plan")) return planSheet(t.dataset.plan || null);
  if (t.dataset.heropen) {
    const x = data.planning[t.dataset.heropen]; if (!x) return;
    if (x.gedaan && x.gedaan.log) write("log/" + x.gedaan.log, null);
    write("planning/" + t.dataset.heropen + "/gedaan", null);
    toast("↩︎ Terug in de planning"); $("#toastUndo").classList.add("hidden"); setTimeout(() => $("#toastUndo").classList.remove("hidden"), 4600);
    return;
  }
  if (t.dataset.unplan) { write("planning/" + t.dataset.unplan, null); if ($("#sheet").classList.contains("open") && $("#sheet").querySelector("#dPlan")) closeSheet(); return; }
  if (t.hasAttribute("data-add")) return editSheet(null);
  if (t.dataset.filter) { filter = t.dataset.filter; return render(); }
  if (t.dataset.cat) { cat = t.dataset.cat; return render(); }
  if (t.dataset.per) { periode = t.dataset.per; return render(); }
  if (t.dataset.del) {
    const e2 = data.log[t.dataset.del]; if (!e2) return;
    const uitPlan = Object.values(data.planning).some(x => x && x.gedaan && x.gedaan.log === t.dataset.del);
    if (confirm(uitPlan ? "Deze afvinking verwijderen? Het klusje komt dan terug in de planning." : "Deze afvinking verwijderen?")) write("log/" + t.dataset.del, null);
    return;
  }
  if (t.dataset.tab) {
    tab = t.dataset.tab;
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    ["klusjes", "boodschappen", "planning", "score", "historie"].forEach(v => $("#v-" + v).classList.toggle("hidden", v !== tab));
    $("#title").textContent = { klusjes: "Klusjes", boodschappen: "Boodschappen", planning: "Planning", score: "Wie doet zijn deel?", historie: "Historie" }[tab];
    window.scrollTo(0, 0); render();
  }
});
$("#gearBtn").onclick = () => settingsSheet(false);

/* ---------- volgorde aanpassen: klusje lang vasthouden en verslepen (touch + muis) ---------- */
let slepen = null;
(() => {
  const lijst = $("#list");
  let timer = null, start = null, kaart = null, klikBlok = false, scrollRaf = null, laatsteY = 0;
  const pos = e => e.touches ? e.touches[0] : e;
  function annuleer() { clearTimeout(timer); timer = null; if (kaart) kaart.classList.remove("houd"); if (!slepen) kaart = null; }
  function begin(e) {
    if (slepen || e.button > 0 || zoek.trim()) return;   // tijdens zoeken niet slepen (gemengde lijst)
    const k = e.target.closest(".card[data-kid]");
    if (!k || e.target.closest(".who")) return;
    kaart = k; const p = pos(e); start = { x: p.clientX, y: p.clientY };
    k.classList.add("houd");
    timer = setTimeout(() => pak(p.clientY), 450);
  }
  function pak(y) {
    timer = null; if (!kaart) return;
    const r = kaart.getBoundingClientRect();
    const plek = document.createElement("div"); plek.className = "sleep-plek"; plek.style.height = r.height + "px";
    kaart.parentNode.insertBefore(plek, kaart);
    kaart.classList.remove("houd"); kaart.classList.add("sleep");
    Object.assign(kaart.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px" });
    slepen = { kaart, plek, grp: kaart.dataset.grp, dy: y - r.top };
    laatsteY = y; klikBlok = true;
    if (navigator.vibrate) navigator.vibrate(30);
    autoScroll();
  }
  function beweeg(e) {
    if (timer) { const p = pos(e); if (Math.abs(p.clientX - start.x) > 8 || Math.abs(p.clientY - start.y) > 8) annuleer(); return; }
    if (!slepen) return;
    if (e.cancelable) e.preventDefault();
    laatsteY = pos(e).clientY; plaats();
  }
  function plaats() {
    const { kaart, plek, grp, dy } = slepen;
    kaart.style.top = (laatsteY - dy) + "px";
    const anderen = [...lijst.querySelectorAll(`.card[data-grp="${grp}"]:not(.sleep)`)];
    const voor = anderen.find(a => { const r = a.getBoundingClientRect(); return laatsteY < r.top + r.height / 2; });
    if (voor) { if (plek.nextSibling !== voor) lijst.insertBefore(plek, voor); }
    else if (anderen.length) { const laatste = anderen[anderen.length - 1]; if (laatste.nextSibling !== plek) lijst.insertBefore(plek, laatste.nextSibling); }
  }
  function autoScroll() {
    if (!slepen) return;
    const marge = 90, onder = innerHeight - 110;
    if (laatsteY < marge) { window.scrollBy(0, -10); plaats(); }
    else if (laatsteY > onder) { window.scrollBy(0, 10); plaats(); }
    scrollRaf = requestAnimationFrame(autoScroll);
  }
  function eind() {
    if (timer) { annuleer(); return; }
    if (!slepen) return;
    cancelAnimationFrame(scrollRaf);
    const { kaart: k, plek, grp } = slepen;
    lijst.insertBefore(k, plek); plek.remove();
    k.classList.remove("sleep"); k.removeAttribute("style");
    const ids = [...lijst.querySelectorAll(`.card[data-grp="${grp}"]`)].map(c => c.dataset.kid);
    slepen = null; kaart = null;
    const r = id => rang({ id, k: data.klusjes[id] || {} });
    const i = ids.indexOf(k.dataset.kid), vorige = ids[i - 1], volgende = ids[i + 1];
    let nieuw;
    if (vorige && volgende) nieuw = (r(vorige) + r(volgende)) / 2;
    else if (vorige) nieuw = r(vorige) + 1;
    else if (volgende) nieuw = r(volgende) - 1;
    if (nieuw !== undefined && (!vorige || nieuw > r(vorige)) && (!volgende || nieuw < r(volgende))) {
      if (nieuw !== r(k.dataset.kid)) write("volgorde/" + k.dataset.kid, nieuw);
    } else ids.forEach((id, j) => { if (data.volgorde[id] !== j) write("volgorde/" + id, j); });   // buren gelijk: groep opnieuw nummeren
    render();
    setTimeout(() => { klikBlok = false; }, 50);
  }
  lijst.addEventListener("touchstart", begin, { passive: true });
  lijst.addEventListener("touchmove", beweeg, { passive: false });
  lijst.addEventListener("touchend", eind); lijst.addEventListener("touchcancel", eind);
  lijst.addEventListener("mousedown", begin);
  window.addEventListener("mousemove", e => { if (timer || slepen) beweeg(e); });
  window.addEventListener("mouseup", eind);
  lijst.addEventListener("contextmenu", e => { if (e.target.closest(".card")) e.preventDefault(); });
  // na het slepen geen klik doorlaten (anders opent het klusje)
  lijst.addEventListener("click", e => { if (klikBlok) { e.stopPropagation(); e.preventDefault(); klikBlok = false; } }, true);
})();
$("#zoek").addEventListener("input", () => { zoek = $("#zoek").value; $("#zoekWis").classList.toggle("hidden", !zoek); render(); });
$("#zoekWis").onclick = () => { zoek = ""; $("#zoek").value = ""; $("#zoekWis").classList.add("hidden"); render(); };

/* ---------- start ---------- */
if (!url()) { seedIfEmpty(); }          // lokaal: meteen standaard klusjes
rebuild(); render(); connect(); flush();
if (!me) setTimeout(() => settingsSheet(true), 300);
setInterval(render, 60000);
checkVersie(); setInterval(checkVersie, 5 * 60000);          // "vandaag/morgen" bijwerken na middernacht
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
